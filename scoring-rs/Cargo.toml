[package]
name = "scoring_rs"
version = "0.1.0"
edition = "2021"
description = "Noyau de scoring ObjectiFoudre en Rust (parallèle au Python, pour parité + benchmark)"

[lib]
name = "scoring_rs"
# cdylib = bibliothèque chargeable par Python (extension module).
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
