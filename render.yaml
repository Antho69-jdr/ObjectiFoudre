services:
  - type: web
    name: objectifoudre
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: METEOFRANCE_API_KEY
        sync: false
      - key: OBJECTIFOUDRE_PRELOAD_SECRET
        sync: false
      - key: OBJECTIFOUDRE_AUTO_PRELOAD
        value: "1"
      - key: OBJECTIFOUDRE_AUTO_PRELOAD_DAYS
        value: today,tomorrow
      - key: OBJECTIFOUDRE_AUTO_PRELOAD_INTERVAL_SECONDS
        value: "300"
      - key: OBJECTIFOUDRE_CACHE_DIR
        value: /var/data/meteofrance
      - key: OBJECTIFOUDRE_GRIB_NATIONAL_FIELD_REGISTRY
        value: "1"
      - key: OBJECTIFOUDRE_TIMEZONE
        value: Europe/Paris
    disk:
      name: objectifoudre-cache
      mountPath: /var/data
      sizeGB: 2
